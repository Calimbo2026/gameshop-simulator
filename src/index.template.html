<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>GameShop Simulator</title>
<meta name="description" content="GameShop Simulator: sobreviví a una jornada atendiendo el local. Juego gratis, sin registro.">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex">
<meta property="og:type" content="website">
<meta property="og:title" content="GameShop Simulator">
<meta property="og:description" content="¿Te animás a un turno en GameShop? Atendé el mostrador, cobrá, armá PC y sobreviví a la jornada. Gratis y sin registro.">
<meta name="twitter:card" content="summary">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23000'/%3E%3Cpath d='M12 20h40a8 8 0 0 1 8 8v8a10 10 0 0 1-18 6l-3-4H25l-3 4a10 10 0 0 1-18-6v-8a8 8 0 0 1 8-8z' fill='%23ff0000'/%3E%3Ccircle cx='44' cy='30' r='4' fill='%23fff'/%3E%3Cpath d='M16 30h10M21 25v10' stroke='%23fff' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
/*__CSS__*/
</style>
</head>
<body>
<canvas id="c" aria-label="Local de GameShop en 3D"></canvas>
<div id="rain" hidden></div>
<div id="labels"></div>

<!-- HUD de la jornada -->
<div id="hud" hidden>
  <div class="hud-bar">
    <button class="icon-btn" id="btnPause" aria-label="Pausa">⏸</button>
    <div class="clock"><div class="t"><span id="clockT">10:00</span><small id="clockS">Abrimos</small></div><div class="bar"><i id="clockB"></i></div></div>
    <div class="score"><b id="scoreV">0</b><small>puntos</small></div>
    <button class="icon-btn" id="btnMute" aria-label="Sonido">🔊</button>
  </div>
  <div class="chips">
    <button class="chip phase" id="chipPhase">Fase 1 de 5</button>
    <span class="chip" id="chipSales">💰 $0</span>
    <span class="chip" id="chipRep">⭐ 3,0</span>
    <button class="chip cord" id="chipCord">🧠 75</button>
    <span class="chip rep" id="chipCond" hidden></span>
    <span class="chip combo" id="chipCombo" hidden>🔥 x2</span>
  </div>
</div>
<div id="toasts" aria-live="polite"></div>
<div id="jobs" hidden></div>

<!-- Panel de minijuego -->
<div id="mg" hidden></div>

<!-- Inicio -->
<section class="screen" id="start">
  <div class="col">
    <div>
      <img class="logo" id="logoImg" alt="GameShop">
      <div class="sub">SIMULATOR</div>
      <p class="tag">Entrá. Elegí. Sobreviví al turno.</p>
      <p class="rank" id="rankT"></p>
    </div>
    <div style="display:flex;flex-direction:column;gap:12px">
      <button class="btn" id="btnPlay"><span id="playT">Jugar la jornada 1</span><small id="playS">De 10 a 19 · en tandas, con respiros</small></button>
      <div class="duo"><div id="goalStart"></div><button class="plot" id="btnPlot" aria-label="El local de al lado: fondo y libreta"></button></div>
      <button class="btn alt" id="btnShop">🛠 Mejorar el local<small>Gastá tus monedas o aportá al fondo</small></button>
      <div class="row"><button class="btn ghost" id="btnRelax">Turno tranquilo</button><button class="btn ghost" id="btnArcade">🕹️ Arcade</button></div>
      <div class="row">
        <button class="btn ghost" id="btnHow">Cómo se juega</button>
        <button class="btn ghost" id="btnRecs">Récords</button>
        <button class="btn ghost" id="btnOpts">Opciones</button>
      </div>
      <a class="btn ghost" id="btnStore" target="_blank" rel="noopener" hidden>🛒 Ir a la tienda de verdad</a>
      <button class="phases" id="phasesStart" aria-label="Etapas del proyecto"></button>
      <p class="fine">Versión en construcción. Precios y stock ficticios.<br>Personajes inventados: cualquier parecido es pura coincidencia.</p>
    </div>
  </div>
</section>

<!-- Tienda de mejoras -->
<div id="shop" hidden>
  <div class="shop-top"><b>Mejoras del local</b><span id="shopCoins">🪙 0</span><button class="btn ghost" id="shopDone">Listo</button></div>
  <div class="shop-panel"><div class="shop-nav"><button class="icon-btn" id="shopPrev" aria-label="Mejora anterior">‹</button><div class="shop-slots" id="shopSlots"></div><button class="icon-btn" id="shopNext" aria-label="Mejora siguiente">›</button></div><div class="shop-cards" id="shopCards"></div><div class="rule" id="shopHint"></div><div class="shop-fund" id="shopFund"></div></div>
</div>

<!-- Placas de presentación del modo carrera -->
<div id="intro" hidden><div class="fin-card" id="introCard"></div></div>

<!-- Escena final -->
<div id="final" hidden><div class="confetti" id="confetti"></div><button class="btn ghost" id="finSkip">Saltar ›</button><div class="fin-card" id="finCard" hidden></div></div>

<!-- Cierre de caja -->
<section class="screen" id="end" hidden><div class="col" id="endCol"></div></section>

<!-- Modal genérico -->
<div id="modal" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

<script>
/*__THREE__*/
</script>
<script>
/*__JS__*/
</script>
</body>
</html>
